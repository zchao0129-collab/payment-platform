server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: payment-platform
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
  access-token-expire: 86400
  refresh-token-expire: 604800

# 收银台前端地址（用于码牌 URL 生成、支付结果页回跳）
app:
  cashier-base-url: ${CASHIER_BASE_URL:http://localhost:8080}
  # 开放API对外域名（支付链接 payUrl / 支付完成跳转链接 的拼接基地址），按实际对外域名修改
  open-api-base-url: ${OPEN_API_BASE_URL:http://localhost:8080}

file:
  upload-path: ${UPLOAD_PATH:./upload}

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.payment.platform.controller

# 支付宝配置
alipay:
  gateway: https://openapi.alipay.com/gateway.do
  # 支付宝异步通知可达的公网地址（用于 notify_url）
  notify-base-url: ${ALIPAY_NOTIFY_BASE_URL:http://localhost:8080}
  # 签名类型
  sign-type: RSA2

# 微信支付配置
wechat:
  pay-gateway: https://api.mch.weixin.qq.com
  notify-base-url: ${WECHAT_NOTIFY_BASE_URL:http://localhost:8080}

# 短信 (placeholder)
sms:
  provider: aliyun
  aliyun:
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: 支付商户平台
